<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background abstract shapes -->
  <circle cx="500" cy="50" r="80" fill="url(#grad1)" opacity="0.1" />
  <circle cx="100" cy="300" r="120" fill="url(#grad2)" opacity="0.1" />

  <!-- Main illustration: full stack developer -->
  <g transform="translate(120, 60)">
    <!-- Laptop (frontend) -->
    <rect x="50" y="140" width="180" height="110" rx="10" fill="#1F2937" />
    <rect x="60" y="150" width="160" height="80" rx="6" fill="#F9FAFB" />
    <!-- Screen code lines -->
    <line x1="80" y1="170" x2="200" y2="170" stroke="#4F46E5" strokeWidth="3" strokeLinecap="round" />
    <line x1="80" y1="185" x2="180" y2="185" stroke="#0EA5E9" strokeWidth="3" strokeLinecap="round" />
    <line x1="80" y1="200" x2="190" y2="200" stroke="#F59E0B" strokeWidth="3" strokeLinecap="round" />
    <circle cx="210" cy="200" r="4" fill="#10B981" />
    <!-- Laptop base -->
    <rect x="45" y="250" width="190" height="10" rx="5" fill="#374151" />

    <!-- Server (backend) -->
    <rect x="280" y="180" width="70" height="100" rx="8" fill="#4F46E5" opacity="0.9" />
    <rect x="290" y="190" width="50" height="15" rx="4" fill="#F9FAFB" />
    <rect x="290" y="215" width="50" height="15" rx="4" fill="#F9FAFB" />
    <rect x="290" y="240" width="50" height="15" rx="4" fill="#F9FAFB" />
    <circle cx="315" cy="265" r="5" fill="#F59E0B" />
    <circle cx="345" cy="265" r="5" fill="#F59E0B" />

    <!-- Database (cylinder) -->
    <ellipse cx="390" cy="210" rx="30" ry="15" fill="#0EA5E9" opacity="0.8" />
    <rect x="360" y="210" width="60" height="50" rx="10" fill="#0EA5E9" opacity="0.8" />
    <ellipse cx="390" cy="260" rx="30" ry="15" fill="#0EA5E9" opacity="0.8" />
    <!-- Database lines -->
    <line x1="365" y1="225" x2="415" y2="225" stroke="#F9FAFB" strokeWidth="2" />
    <line x1="365" y1="245" x2="415" y2="245" stroke="#F9FAFB" strokeWidth="2" />

    <!-- Developer avatar (now with coffee!) -->
    <circle cx="150" cy="80" r="30" fill="#4F46E5" />
    <!-- Headphones (or maybe headset) -->
    <circle cx="130" cy="65" r="8" fill="#374151" />
    <circle cx="170" cy="65" r="8" fill="#374151" />
    <path d="M130 65 Q150 55 170 65" stroke="#374151" strokeWidth="4" fill="none" />
    <!-- Coffee mug -->
    <rect x="100" cy="90" y="90" width="20" height="25" rx="6" fill="#6B4F3C" />
    <ellipse cx="110" cy="90" rx="10" ry="5" fill="#8B6B4F" />
    <path d="M120 95 L125 95 L125 105 L120 105" fill="#8B6B4F" />
  </g>

  <!-- Floating tech icons (decorative) -->
  <g opacity="0.3">
    <!-- Code brackets -->
    <text x="420" y="80" fontSize="40" fill="#4F46E5" fontFamily="monospace">{ }</text>
    <!-- Cloud -->
    <circle cx="480" cy="150" r="20" fill="#0EA5E9" />
    <circle cx="460" cy="140" r="15" fill="#0EA5E9" />
    <circle cx="500" cy="140" r="15" fill="#0EA5E9" />
    <!-- Database mini -->
    <ellipse cx="350" cy="320" rx="15" ry="8" fill="#F59E0B" />
    <rect x="340" y="320" width="20" height="20" rx="4" fill="#F59E0B" />
    <ellipse cx="350" cy="340" rx="15" ry="8" fill="#F59E0B" />
  </g>

  <!-- Gradients (same as before) -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="100%" stopColor="#0EA5E9" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
  </defs>
</svg>