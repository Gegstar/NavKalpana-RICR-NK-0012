<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" />
      <feOffset dx="2" dy="2" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="25" y="15" width="350" height="270" rx="15" fill="url(#bgGradient)" stroke="#3B82F6" stroke-width="2" />

  <g transform="translate(0, 5)">
    <!-- Accurate Python Logo (two interlocking snakes) -->
    <g transform="translate(200, 105)" filter="url(#logoShadow)">
      <!-- Blue snake (left) -->
      <path d="M-44,-38 C-58,-26 -58,-6 -44,6 C-30,18 -10,18 4,6 C18,-6 18,-26 4,-38 C-10,-50 -30,-50 -44,-38 Z"
            fill="#3776AB" />
      <!-- Yellow snake (right) -->
      <path d="M4,-38 C18,-50 38,-50 52,-38 C66,-26 66,-6 52,6 C38,18 18,18 4,6 C-10,-6 -10,-26 4,-38 Z"
            fill="#FFD43B" />
      <!-- Overlap detail (create interlocking illusion) -->
      <path d="M-6,0 C-6,8 -2,12 4,12 C10,12 14,8 14,0 C14,-8 10,-12 4,-12 C-2,-12 -6,-8 -6,0 Z"
            fill="#3776AB" opacity="0.9" />
      <!-- Eyes -->
      <circle cx="-28" cy="-20" r="3.5" fill="white" />
      <circle cx="-26" cy="-22" r="1.8" fill="black" />
      <circle cx="36" cy="-4" r="3.5" fill="white" />
      <circle cx="34" cy="-6" r="1.8" fill="black" />
    </g>

    <!-- Text Group -->
    <g transform="translate(200, 215)" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
      <text font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">PYTHON</text>
      <text y="38" font-size="22" font-weight="700" fill="#FFD43B" letter-spacing="0.5">FOR BEGINNERS</text>
    </g>
    <g transform="translate(200, 277)" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
      <text font-size="10" font-weight="600" fill="#9CA3AF" opacity="0.9">SKILLVERSE CERTIFIED</text>
    </g>
  </g>
</svg>