<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" /> <stop offset="100%" stop-color="#111827" /> </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feColorMatrix in="blur" mode="matrix" values="0 0 0 0 0.23   0 0 0 0 0.51   0 0 0 0 0.96  0 0 0 1 0" result="blueGlow" /> <feMerge>
        <feMergeNode in="blueGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="25" y="15" width="350" height="270" rx="15" fill="url(#bgGradient)" stroke="#3B82F6" stroke-width="2" />
  
  <g transform="translate(0, 10)">
    
    <g transform="translate(200, 100)" filter="url(#subtleGlow)">
      <rect x="-60" y="-50" width="120" height="90" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <rect x="-60" y="-50" width="120" height="20" rx="8" fill="#475569" />
      
      <g fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-30,-15 L-10,5 L-30,25" /> <path d="M30,25 L10,5 L30,-15" /> <line x1="-5" y1="-15" x2="-5" y2="25" stroke="#FFFFFF" stroke-width="8"/> </g>
      
      <circle cx="0" cy="5" r="35" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4" />
      <ellipse rx="35" ry="10" cx="0" cy="5" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.3" />
      <ellipse rx="10" ry="35" cx="0" cy="5" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.3" />
    </g>

    <g transform="translate(200, 210)" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      <text font-size="28" font-weight="900" fill="#FFFFFF">
        COMPLETE
      </text>
      <text y="35" font-size="24" font-weight="800" fill="#60A5FA">
        WEB DEVELOPMENT
      </text>
    </g>
    
    <g transform="translate(200, 275)" text-anchor="middle" font-family="Inter, sans-serif">
      <rect x="-80" y="-10" width="160" height="20" rx="10" fill="rgb(17, 63, 138)" />
      <text y="4" font-size="10" font-weight="700" fill="#ffff" text-anchor="middle">
        SKILLVERSE CERTIFIED
      </text>
    </g>
  </g>
</svg>
