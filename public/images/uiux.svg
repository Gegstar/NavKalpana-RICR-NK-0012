<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetBlur" />
      <feMerge>
        <feMergeNode in="offsetBlur" />
        <feMergeNode in="SourceGraphic" />
        
      </feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="360" height="260" rx="20" fill="url(#blueGrad)" stroke="#3B82F6" stroke-width="3" />
  
  <g transform="translate(200, 110)" filter="url(#layerShadow)">
    <rect x="-60" y="-40" width="100" height="70" rx="8" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.5" transform="skewX(-10) translate(-10, 20)" />
    
    <rect x="-50" y="-30" width="100" height="70" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" transform="skewX(-10) translate(-5, 10)" />
    <line x1="-35" y1="-10" x2="15" y2="-10" stroke="#3B82F6" stroke-width="4" transform="skewX(-10) translate(-5, 10)" />
    
    <rect x="-40" y="-20" width="100" height="70" rx="8" fill="#FFFFFF" transform="skewX(-10)" />
    <circle cx="-10" cy="5" r="12" fill="#3B82F6" transform="skewX(-10)" />
    <rect x="15" y="-5" width="30" height="6" rx="2" fill="#E2E8F0" transform="skewX(-10)" />
    <rect x="15" y="10" width="20" height="6" rx="2" fill="#E2E8F0" transform="skewX(-10)" />
    
    <path d="M40,25 L55,40 L48,42 L52,50 L48,52 L44,44 L38,48 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <text x="200" y="215" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    UI/UX DESIGN
  </text>
  
  <text x="200" y="245" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#60A5FA" text-anchor="middle" letter-spacing="2">
    FUNDAMENTALS
  </text>

  <g transform="translate(200, 272)">
    <text font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" fill="#9CA3AF" text-anchor="middle" opacity="0.8">
      SKILLVERSE CREATIVE ACADEMY
    </text>
  </g>
</svg>
